name: Build DreamVideo AI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/dreamvideo/ai
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "plugins { id 'com.android.application' } android { namespace 'com.dreamvideo.ai'; compileSdk 34; defaultConfig { applicationId 'com.dreamvideo.ai'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          echo "<manifest xmlns:android='http://schemas.android.com/apk/res/android'><application android:label='DreamVideo AI'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN'/><category android:name='android.intent.category.LAUNCHER'/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/java/com/dreamvideo/ai
          echo "package com.dreamvideo.ai; import android.os.Bundle; import android.widget.*; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); TextView t=new TextView(this); t.setText('DreamVideo AI - APK Ready'); t.setTextSize(24); setContentView(t); } }" > app/src/main/java/com/dreamvideo/ai/MainActivity.java
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: DreamVideo-AI-APK, path: app/build/outputs/apk/debug/app-debug.apk }
